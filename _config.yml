timezone: Asia/Seoul

title: "프렛노트"  # 후보: 코드노트, 타브살롱, 핑거노트 — 마음에 안 들면 바로 바꿔도 됨
description: "기타 코드와 악보, 연주 팁을 파고드는 블로그"
url: "https://miyaumiyau.github.io"
baseurl: "/T419_Blog"

theme: minima

# 카테고리(한글 포함)를 URL에 넣지 않도록 permalink 고정 — 안 그러면 기본값이
# categories를 그대로 URL 경로에 써서 한글이 퍼센트 인코딩된 지저분한 주소가 됨
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

show_excerpts: true

# 상단 메뉴에 표시할 페이지
header_pages:
  - categories.md
